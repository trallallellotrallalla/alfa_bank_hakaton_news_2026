stop_url_parts: [/sport, /sports, /culture, /lifestyle, /style/, /auto/test, /photo/, /video/]

# Синтаксис keywords: "ключев ставк" — основы слов (каждое слово ищется с начала
# слова, окончание любое); "re:..." — регулярное выражение целым словом
# (для коротких основ вроде «газ», которые иначе ловят «газету»).

# Признаки «про бизнес/экономику». Если в тексте нет ни одной метки и ни одного
# такого слова — статья считается малосигнальной и в LLM не идёт.
business_keywords: [компани, рынок, рынк, цен, млрд, млн, трлн, выручк, прибыл, убыт, инвест, производств, предприяти, отрасл, экономик, банк, бизнес, спрос, поставк, тариф, рубл, доллар, процент]
