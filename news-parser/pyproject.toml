[project]
name = "news-parser"
version = "0.1.0"
description = "Модуль сбора, очистки, классификации и индексации новостей и аналитики Альфа-Банка для RAG"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0.32",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "alembic>=1.13",
    "httpx>=0.27",
    "feedparser>=6.0",
    "trafilatura>=1.12",
    "apscheduler>=3.10,<4",
    "pypdf>=4.3",
    "pillow>=10.0",  # картинки страниц PDF-сканов для Qwen3-VL
    "fastembed>=0.4",
    "pyyaml>=6.0",
    "numpy>=1.26",
    # зависимости библиотеки data_loader (модуль клиентских данных, корень репо)
    "psycopg2-binary>=2.9",
    "python-dotenv>=1.0",
    "pandas>=2.2",
]

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/news_parser"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
