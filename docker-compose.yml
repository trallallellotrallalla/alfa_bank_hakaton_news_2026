services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: news
      POSTGRES_PASSWORD: news
      POSTGRES_DB: news
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U news -d news"]
      interval: 5s
      retries: 10

  news-parser:
    build:
      context: ./news-parser
      dockerfile: Dockerfile
    env_file: ./news-parser/.env
    volumes:
      - ./data/alfa:/data/alfa:ro   # PDF аналитики Альфа-Банка
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8001:8000"
    restart: unless-stopped

volumes:
  pgdata:
