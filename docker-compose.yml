services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: news
      POSTGRES_PASSWORD: news
      POSTGRES_DB: news
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U news -d news"]
      interval: 5s
      retries: 10

  news-parser:
    build:
      # контекст — корень репо: в образ входят news-parser, data_loader и interpreter.
      # Что именно уходит в сборку — задаёт .dockerignore в корне.
      context: .
      dockerfile: news-parser/Dockerfile
    env_file: ./.env
    volumes:
      # PDF аналитики Альфа-Банка. Без :ro — рядом с PDF сохраняется кеш распознавания
      # (<имя>.analysis.json), чтобы не тратить токены повторно
      - ./data/alfa:/data/alfa
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
